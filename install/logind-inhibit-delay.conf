# retro-sleep-lock.service holds a delay inhibitor so the session is locked
# before the machine suspends. A delay inhibitor is a timer, not a promise:
# logind suspends anyway once the window expires, locked or not. The 5s
# default is tight when closing a lid also reconfigures displays, because
# the shell waits for the screen set to settle before it can secure.
#
# Install: sudo install -Dm644 install/logind-inhibit-delay.conf /etc/systemd/logind.conf.d/20-inhibit-delay.conf
[Login]
InhibitDelayMaxSec=15
