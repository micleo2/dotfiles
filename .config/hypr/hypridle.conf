# Idle and suspend hooks for the retro shell's lock screen (quickshell/retro:
# Lock.qml, lock/). The locker itself lives in the shell; hypridle only decides
# when to ask for it and keeps logind from suspending before it is up.

general {
    # loginctl lock-session lands here.
    lock_cmd = qs -c retro ipc call lock lock
    # Lock before suspend. With inhibit_sleep = 3 hypridle holds a logind delay
    # inhibitor and releases it only when Hyprland reports the session locked
    # (hyprland-lock-notify), which is the moment WlSessionLock.secure turns
    # true in the shell. logind still suspends once InhibitDelayMaxSec (5s by
    # default) runs out, locked or not.
    before_sleep_cmd = qs -c retro ipc call lock lock
    inhibit_sleep = 3
}

# Lock after 5 minutes idle.
listener {
    timeout = 300
    on-timeout = qs -c retro ipc call lock lock
}
